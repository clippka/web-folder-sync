spring.application.name=foldersync
# Persistence is configured in app.foldersync.config.PersistenceConfig (SQLite, versioned migrations).
spring.main.banner-mode=off

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Sessions: server-side, HttpOnly, Secure (set to false only for plain-http local development), SameSite=Lax.
server.servlet.session.timeout=12h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.name=FSSESSION
server.error.include-message=never
server.error.include-stacktrace=never

# --- FolderSync (all optional; see docs/SERVER.md) ---
foldersync.data-dir=./data
# foldersync.admin.username=admin
# foldersync.admin.password-file=/run/secrets/foldersync_admin_password
# foldersync.max-file-size-bytes=104857600
# foldersync.deletion-enabled=true    # set false to refuse every deletion (kill switch)
# foldersync.rotate-epoch=false       # set once when starting a server restored from a backup

# --- Deployment (docs/DEPLOYMENT.md) ---
# Behind a TLS-terminating reverse proxy keep this on `framework` and make the proxy the only client of the app port.
server.forward-headers-strategy=${FOLDERSYNC_FORWARD_HEADERS:framework}
management.endpoint.health.show-details=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState
